<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A0B14"/>
      <stop offset="50%" stop-color="#4A1525"/>
      <stop offset="100%" stop-color="#1F080F"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4A1525" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1200" height="600" fill="url(#skyGrad)"/>
  <rect width="1200" height="600" fill="url(#sunGlow)"/>

  <!-- Mountain Silhouettes -->
  <path d="M0 600 L150 420 L320 510 L500 350 L750 490 L950 380 L1200 600 Z" fill="#1A070D" opacity="0.7"/>
  <path d="M0 600 L250 480 L480 540 L700 420 L920 530 L1200 450 L1200 600 Z" fill="#120408" opacity="0.9"/>

  <!-- Subtle Stupa / Buddha Silhouette in background -->
  <g fill="#D4AF37" opacity="0.08" transform="translate(520, 220)">
    <!-- Stupa base -->
    <rect x="30" y="160" width="100" height="20" rx="4"/>
    <rect x="40" y="140" width="80" height="20" rx="4"/>
    <!-- Dome -->
    <path d="M45 140 A 35 35 0 0 1 115 140 Z"/>
    <!-- Spire -->
    <polygon points="80,40 70,105 90,105"/>
    <circle cx="80" cy="30" r="8"/>
  </g>
</svg>
