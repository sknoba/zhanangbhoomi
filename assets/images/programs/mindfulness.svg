<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="gradMind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D5A27"/>
      <stop offset="100%" stop-color="#4A3B32"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gradMind)"/>
  <!-- Leaf / Ripple Mindfulness Icon -->
  <g fill="none" stroke="#F3E5AB" stroke-width="2" transform="translate(300, 180)">
    <circle r="70" stroke-dasharray="3,6"/>
    <circle r="45" opacity="0.7"/>
    <path d="M0 -30 C20 0 0 30 -20 0 Z" fill="#D4AF37" stroke="none"/>
  </g>
  <text x="300" y="310" text-anchor="middle" fill="#F3E5AB" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="600">Mindfulness Practice</text>
  <text x="300" y="340" text-anchor="middle" fill="#FDFBF7" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Present Moment Awareness for Daily Living</text>
</svg>
